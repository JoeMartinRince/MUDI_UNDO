  <path d="M 400 130 H 600 V 330 H 400 Z" fill="#312e81"/>
  <path d="M 460 240 C 460 195, 540 195, 540 240 C 540 285, 525 300, 500 300 C 475 300, 460 285, 460 240 Z" fill="#F3D5C0" stroke="#111" stroke-width="3"/>
  <path d="M 440 230 L 425 190 L 455 185 L 455 145 L 485 160 L 500 135 L 515 160 L 545 145 L 545 185 L 575 190 L 560 230 Z" fill="#F8FAFC" stroke="#111" stroke-width="3"/>
