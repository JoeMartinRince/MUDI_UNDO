  <text x="500" y="410" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#94a3b8" text-anchor="middle">JUJUTSU KAISEN</text>

  <rect x="350" y="430" width="300" height="32" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="500" y="451" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">DOMAIN EXPANSION VOLUME</text>

